name: Browser Extension

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  extension:
    runs-on: ubuntu-latest
    # The repository gives workflow tokens read access only; the release step needs to write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs the pnpm version pinned in package.json's packageManager field.
      # Corepack cannot start pnpm 12, which no longer ships bin/pnpm.cjs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Lint
        run: make install lint
      - name: Type check
        run: make check
      - name: Unit tests
        run: make test-unit
      - name: Install Playwright browsers
        run: cd packages/extension && pnpm exec playwright install --with-deps chromium firefox
      - name: Browser tests
        run: make test-chromium test-firefox
      - name: Build extensions
        run: make chrome firefox
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: inkling-chrome.zip
          path: "packages/extension/package/inkling-chrome.zip"
      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: inkling-firefox.zip
          path: "packages/extension/package/inkling-firefox.zip"
      - name: Release artifacts
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          artifacts: "packages/extension/package/*.zip"
          allowUpdates: true
          draft: true

  # Uploads a tagged release to both stores and submits it for review. The secrets
  # live in the "stores" environment; docs/store/submitting.md says how to set it up.
  stores:
    needs: extension
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check that the packages grant no host access at install time
        run: |
          for zip in dist/inkling-chrome.zip dist/inkling-firefox.zip; do
            if unzip -p "$zip" manifest.json | grep -q '"host_permissions"'; then
              echo "::error::$zip asks for host access at install time"
              exit 1
            fi
          done
      - name: Check that the tag matches the package version
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          git archive --format=zip -o "dist/inkling-source-$GITHUB_REF_NAME.zip" HEAD
          mkdir dist/firefox
          unzip -q dist/inkling-firefox.zip -d dist/firefox
          # The reviewer notes are the text block under "Notes for reviewers" in listing.md.
          awk '/^## Notes for reviewers/ {notes = 1} notes && /^```$/ {exit} notes && block {print} notes && /^```text$/ {block = 1}' \
            docs/store/listing.md > dist/approval-notes.txt
          node -e "const fs = require('fs'); fs.writeFileSync('dist/amo-metadata.json', JSON.stringify({ version: { approval_notes: fs.readFileSync('dist/approval-notes.txt', 'utf8').trim() } }))"
          pnpm dlx web-ext@10.8.0 sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/amo \
            --channel listed \
            --upload-source-code "dist/inkling-source-$GITHUB_REF_NAME.zip" \
            --amo-metadata dist/amo-metadata.json \
            --approval-timeout 0
      - name: Submit to the Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome.mjs dist/inkling-chrome.zip
      - name: Publish the GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          updateOnlyUnreleased: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: false
