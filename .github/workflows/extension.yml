name: Browser Extension

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  extension:
    runs-on: ubuntu-latest
    # The repository gives workflow tokens read access only; the release step needs to write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs the pnpm version pinned in package.json's packageManager field.
      # Corepack cannot start pnpm 12, which no longer ships bin/pnpm.cjs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Lint
        run: make install lint
      - name: Type check
        run: make check
      - name: Unit tests
        run: make test-unit
      - name: Install Playwright browsers
        run: cd packages/extension && pnpm exec playwright install --with-deps chromium firefox
      - name: Browser tests
        run: make test-chromium test-firefox
      - name: Build extensions
        run: make chrome firefox
      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: inkling-chrome.zip
          path: "packages/extension/package/inkling-chrome.zip"
      - name: Upload Firefox extension
        uses: actions/upload-artifact@v7
        with:
          name: inkling-firefox.zip
          path: "packages/extension/package/inkling-firefox.zip"
      - name: Release artifacts
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          artifacts: "packages/extension/package/*.zip"
          allowUpdates: true
          draft: true
